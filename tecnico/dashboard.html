<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIT — Tecnico Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b10;--surface:#0d1117;--surface2:#131820;--border:#1e2a38;--accent:#00d4ff;--accent2:#0077ff;--text:#e8f0f8;--muted:#4a6070;--success:#00e5a0;--error:#ff4560;--warn:#ffb700;}

/* ══════════════════════════════════════════
   TEMA CLARO — BLANCO PROFESIONAL
   ══════════════════════════════════════════ */
[data-theme="light"] {
  --bg:      #ffffff;
  --surface: #f5f7fa;
  --surface2:#eef1f6;
  --border:  #dde2ed;
  --accent:  #0077ff;
  --accent2: #0055cc;
  --text:    #111827;
  --muted:   #6b7280;
  --success: #059669;
  --error:   #dc2626;
  --warn:    #d97706;
  --purple:  #7c3aed;
}
[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(0,85,204,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,85,204,0.04) 1px, transparent 1px);
}
[data-theme="light"] .topbar {
  background: rgba(255,255,255,0.97);
  box-shadow: 0 1px 12px rgba(0,0,0,0.08);
}
[data-theme="light"] .sidebar {
  background: #f5f7fa;
  box-shadow: 1px 0 12px rgba(0,0,0,0.05);
}
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] textarea {
  background: #ffffff;
  color: var(--text);
}
[data-theme="light"] input::placeholder,
[data-theme="light"] textarea::placeholder { color: #9ca3af; }
[data-theme="light"] select option { background: #ffffff; color: #111827; }
[data-theme="light"] .modal,
[data-theme="light"] .modal-overlay > .modal { background: #ffffff; }
[data-theme="light"] .tw,
[data-theme="light"] .stat-card,
[data-theme="light"] .cot-card,
[data-theme="light"] .proto-preview,
[data-theme="light"] .res-card,
[data-theme="light"] .card { background: #ffffff; }
[data-theme="light"] tbody tr:hover { background: #f0f4ff; }
[data-theme="light"] .nav-item.active { background: rgba(0,85,204,0.08); }
[data-theme="light"] .nav-item:hover  { background: rgba(0,0,0,0.04); }
[data-theme="light"] .badge.b-borrador { background: rgba(107,114,128,0.1); }
[data-theme="light"] #themeToggle {
  background: rgba(0,85,204,0.08);
  border-color: rgba(0,85,204,0.2);
}

/* TOGGLE BUTTON BASE */
#themeToggle {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
#themeToggle:hover { opacity: 0.8; transform: scale(1.05); }

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Mono",monospace;background:var(--bg);color:var(--text);min-height:100vh;display:grid;grid-template-rows:60px 1fr;grid-template-columns:220px 1fr;}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.topbar{grid-column:1/-1;background:rgba(8,11,16,0.97);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);}
.logo-img{width:32px;height:32px;object-fit:contain;}
.logo-name{font-family:"Syne",sans-serif;font-size:13px;font-weight:700;color:var(--text);}
.topbar-sep{flex:1;}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:20px 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;z-index:10;}
.sidebar-label{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:0 20px;margin-bottom:8px;}
.sidebar-section{margin-bottom:24px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:all 0.2s;color:var(--muted);font-size:12px;letter-spacing:0.5px;border:none;background:none;width:100%;text-align:left;text-decoration:none;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(0,119,255,0.1);color:var(--accent);border-left:2px solid var(--accent2);}
.nav-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--warn);color:#080b10;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;}
.main{padding:24px;overflow-y:auto;position:relative;z-index:1;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden;}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;}
.s-asig::before{background:var(--accent2);}
.s-proc::before{background:var(--accent);}
.s-done::before{background:var(--success);}
.stat-label{font-size:9px;color:var(--muted);letter-spacing:2px;margin-bottom:6px;}
.stat-val{font-family:"Syne",sans-serif;font-size:32px;font-weight:800;line-height:1;}
.s-asig .stat-val{color:var(--accent2);}
.s-proc .stat-val{color:var(--accent);}
.s-done .stat-val{color:var(--success);}
.stat-sub{font-size:10px;color:var(--muted);margin-top:3px;}

/* FILTROS */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.sec-title{font-family:"Syne",sans-serif;font-size:13px;font-weight:700;color:var(--text);}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.fbtn{padding:7px 14px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;}
.fbtn:hover{border-color:var(--accent2);color:var(--text);}
.fbtn.active{background:rgba(0,119,255,0.1);border-color:var(--accent2);color:var(--accent);}

/* ORDENES LISTA */
.ordenes-list{display:flex;flex-direction:column;gap:10px;}
.orden-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.orden-card:hover{border-color:var(--accent2);transform:translateY(-1px);}
.orden-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
.oc-pendiente::before{background:var(--warn);}
.oc-asignada::before{background:var(--accent2);}
.oc-en_proceso::before{background:var(--accent);}
.oc-en_pausa::before{background:#ff8c00;}
.oc-cerrada::before{background:var(--success);}
.oc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.oc-id{font-family:"Syne",sans-serif;font-weight:700;color:var(--accent);font-size:13px;letter-spacing:0.5px;}
.oc-empresa{color:var(--text);font-size:13px;font-weight:500;}
.oc-contacto{color:var(--muted);font-size:11px;margin-top:2px;}
.oc-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.oc-field .ofl{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px;}
.oc-field .ofv{font-size:12px;color:var(--text);}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:9px;letter-spacing:1px;font-weight:700;border:1px solid;}
.b-asignada{background:rgba(0,119,255,0.1);border-color:rgba(0,119,255,0.3);color:var(--accent2);}
.b-en_proceso{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.3);color:var(--accent);}
.b-en_pausa{background:rgba(255,140,0,0.1);border-color:rgba(255,140,0,0.3);color:#ff8c00;}
.b-cerrada{background:rgba(0,229,160,0.1);border-color:rgba(0,229,160,0.3);color:var(--success);}
.b-pendiente{background:rgba(255,183,0,0.1);border-color:rgba(255,183,0,0.3);color:var(--warn);}
.pri-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;}
.p-baja{background:var(--success);}
.p-media{background:var(--warn);}
.p-alta{background:var(--error);}
.p-critica{background:var(--error);box-shadow:0 0 6px var(--error);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.btn{padding:8px 16px;border-radius:7px;font-family:"Syne",sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.5px;transition:all 0.2s;border:none;}
.btn-o{background:none;border:1px solid var(--border);color:var(--muted);}
.btn-o:hover{border-color:var(--accent2);color:var(--accent);}

/* TEMA CLARO — FORMULARIOS LEGIBLES */
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] textarea { color: #111827 !important; background: #ffffff; border-color: #d1d5db; }
[data-theme="light"] input:disabled,
[data-theme="light"] select:disabled { background: #f9fafb !important; color: #374151 !important; }
[data-theme="light"] label { color: #374151; }
[data-theme="light"] .muted,
[data-theme="light"] [style*="color:var(--muted)"] { color: #6b7280; }
[data-theme="light"] tbody td { color: #111827; }
[data-theme="light"] .modal,
[data-theme="light"] .modal-overlay > div { background: #ffffff !important; }
[data-theme="light"] .msec-t { color: #111827; }
[data-theme="light"] .item-row input { background: #ffffff; color: #111827; border-color: #d1d5db; }
[data-theme="light"] .items-wrap { background: #f9fafb; border-color: #d1d5db; }
[data-theme="light"] .items-head { color: #6b7280; background: #f3f4f6; }
[data-theme="light"] .item-total { color: #059669; }
[data-theme="light"] .tot-label { color: #6b7280; }
[data-theme="light"] .tot-val { color: #111827; }
[data-theme="light"] .sec-head .sec-title { color: #111827; }
[data-theme="light"] .field label { color: #374151; }

/* ══════════════════════════════════════════
   RESPONSIVE MOVIL
   ══════════════════════════════════════════ */
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;flex-direction:column;gap:5px;}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:all 0.3s;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:19;backdrop-filter:blur(2px);}

@media(max-width:768px){
  body{grid-template-columns:1fr !important;}
  .hamburger{display:flex;}
  .sidebar{position:fixed !important;top:0;left:-280px;width:280px;height:100vh !important;z-index:20;transition:left 0.3s ease;box-shadow:4px 0 24px rgba(0,0,0,0.4);}
  .sidebar.open{left:0;}
  .sidebar-overlay.open{display:block;}
  .main{padding:14px !important;}
  .stats-row,.stats-grid{grid-template-columns:1fr 1fr !important;gap:10px !important;}
  .row2,.row3,.row4{grid-template-columns:1fr !important;}
  .filters{flex-direction:column !important;}
  .modal{margin:10px auto !important;}
  .modal-overlay{padding:8px !important;}
  .dgrid{grid-template-columns:1fr !important;}
  .df.full{grid-column:1 !important;}
  .sbtns{flex-wrap:wrap !important;}
  .sbtn{font-size:9px !important;padding:6px 8px !important;}
  .items-head,.item-row{grid-template-columns:28px 1fr 60px 90px 36px !important;}
  .items-head div:nth-child(2),.item-row .i-ref,
  .items-head div:nth-child(6),.item-row .i-dpct,
  .items-head div:nth-child(7),.item-row .i-iva{display:none !important;}
}
@media(max-width:480px){
  .topbar{padding:0 12px !important;gap:8px !important;}
  .logo-name{display:none;}
  .stats-row,.stats-grid{grid-template-columns:1fr 1fr !important;}
  .tab{font-size:10px !important;padding:8px 6px !important;}
  .tab span:last-child{display:none;}
}

</style>

<script>
let _user = null, _tecnico = null, _ordenes = [], _filtro = 'all';

(async () => {
  _user = await initAuth('tecnico');
  if (!_user) return;

  // Obtener tecnico_id — tomar el primero si hay duplicados
  const { data: tecs } = await db.from('tecnicos')
    .select('id,especialidades')
    .eq('usuario_id', _user.id)
    .order('created_at', {ascending:true})
    .limit(1);
  _tecnico = tecs?.[0] || null;
  console.log('Técnico encontrado:', _tecnico?.id);
  if(!_tecnico) {
    const el = document.getElementById('ordenesList');
    if(el) el.innerHTML = '<div class="empty"><p style="color:var(--warn);">⚠ Tu cuenta no tiene perfil de técnico configurado.<br>Contacta al administrador.</p></div>';
    console.warn('No se encontró registro en tabla tecnicos para usuario:', _user.id);
  }
  await loadOrdenes();
  setupEvents();
})();

async function loadOrdenes() {
  const tbody = document.getElementById('ordenesList');
  if (!_tecnico && !_user) {
    if(tbody) tbody.innerHTML='<div class="empty"><p>Sin perfil de técnico</p></div>';
    return;
  }
  try {
    // Buscar por tecnico_id (tabla tecnicos) O por usuario_id directo
    let ordenes = [];
    if (_tecnico?.id) {
      const { data } = await db.from('ordenes')
        .select('*').eq('tecnico_id', _tecnico.id)
        .order('created_at', { ascending: false });
      ordenes = data || [];
    }
    // Si no hay resultados, buscar también por usuario_id en tecnicos
    if (!ordenes.length && _user?.id) {
      const { data } = await db.from('ordenes')
        .select('*').eq('tecnico_id', _user.id)
        .order('created_at', { ascending: false });
      ordenes = data || [];
    }
    _ordenes = ordenes;
    console.log('Órdenes técnico:', _ordenes.length, 'tecnico_id:', _tecnico?.id);
    updateStats();
    renderOrdenes();
  } catch (e) { console.error(e); }
}

function updateStats() {
  document.getElementById('stAsig').textContent = _ordenes.filter(o => o.status === 'asignada').length;
  document.getElementById('stProc').textContent = _ordenes.filter(o => o.status === 'en_proceso').length;
  document.getElementById('stDone').textContent = _ordenes.filter(o => o.status === 'cerrada').length;
  const pend = _ordenes.filter(o => o.status === 'asignada').length;
  const b = document.getElementById('sidebarPend');
  b.textContent = pend; b.style.display = pend > 0 ? 'inline-block' : 'none';
}

function renderOrdenes() {
  const filtered = _filtro === 'all' ? _ordenes : _ordenes.filter(o => o.status === _filtro);
  if (!filtered.length) {
    document.getElementById('ordenesList').innerHTML = '<div class="empty"><p>No hay ordenes en esta categoria</p></div>';
    return;
  }
  document.getElementById('ordenesList').innerHTML = filtered.map(o => {
    const fecha = o.fecha_requerida ? new Date(o.fecha_requerida).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const creada = o.created_at ? new Date(o.created_at).toLocaleDateString('es-CO',{day:'2-digit',month:'short'}) : '—';
    return '<div class="orden-card oc-' + (o.status||'asignada') + '" data-id="' + o.id + '">' +
      '<div class="oc-head">' +
        '<div>' +
          '<div class="oc-id">' + (o.orden_id||'—') + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;">' +
          '<span class="pri-dot p-' + (o.prioridad||'media') + '"></span>' +
          '<span style="font-size:10px;color:var(--muted);">' + (o.prioridad||'media').toUpperCase() + '</span>' +
          '<span class="badge b-' + (o.status||'asignada') + '">' + (o.status||'asignada').replace('_',' ').toUpperCase() + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="oc-empresa">' + (o.empresa||'—') + '</div>' +
      '<div class="oc-contacto">' + (o.nombre||'') + ' · ' + (o.ciudad||'') + '</div>' +
      '<div class="oc-body">' +
        '<div class="oc-field"><div class="ofl">SERVICIO</div><div class="ofv">' + (o.tipo_servicio||'—') + '</div></div>' +
        '<div class="oc-field"><div class="ofl">AREA</div><div class="ofv">' + (o.area||'—') + '</div></div>' +
        '<div class="oc-field"><div class="ofl">FECHA REQ.</div><div class="ofv">' + fecha + '</div></div>' +
      '</div>' +
    '</div>';
  }).join('');

  document.querySelectorAll('.orden-card').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = 'orden.html?id=' + card.dataset.id;
    });
  });
}

function setupEvents() {
  document.getElementById('btnRefresh').addEventListener('click', loadOrdenes);
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      _filtro = btn.dataset.f;
      renderOrdenes();
    });
  });
  document.getElementById('btnExcelNav').addEventListener('click', async () => {
    if (!_ordenes.length) { toast('No hay ordenes para exportar','error'); return; }
    toast('Generando Excel...','info');
    await exportarExcelOrdenes(_ordenes, 'tecnico');
  });
  document.getElementById('btnPdfNav').addEventListener('click', async () => {
    if (!_ordenes.length) { toast('No hay ordenes para exportar','error'); return; }
    toast('Generando PDF...','info');
    await exportarPDFListado(_ordenes, 'Mis Ordenes Asignadas — ' + (_user?.nombre||'Tecnico'));
  });
}

function toast(msg, tipo='success') {
  const c={success:'var(--success)',error:'var(--error)',info:'var(--accent2)'};
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--surface);border:1px solid '+c[tipo]+';border-radius:10px;padding:12px 18px;box-shadow:0 8px 32px rgba(0,0,0,0.4);font-family:"DM Mono",monospace;font-size:12px;color:'+c[tipo]+';';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}

// ── MENU HAMBURGUESA ──────────────────────────────────────────
(function(){
  const btn=document.getElementById('btnHamburger');
  const sidebar=document.querySelector('.sidebar');
  const overlay=document.getElementById('sidebarOverlay');
  if(!btn||!sidebar) return;
  const open=()=>{sidebar.classList.add('open');if(overlay)overlay.classList.add('open');};
  const close=()=>{sidebar.classList.remove('open');if(overlay)overlay.classList.remove('open');};
  btn.addEventListener('click',()=>sidebar.classList.contains('open')?close():open());
  if(overlay) overlay.addEventListener('click',close);
  document.querySelectorAll('.nav-item').forEach(a=>a.addEventListener('click',close));
})();

</script>
</body>
</html>
