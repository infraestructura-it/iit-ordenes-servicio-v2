<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIT — Inventario de Equipos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b10;--surface:#0d1117;--surface2:#131820;--border:#1e2a38;--accent:#00d4ff;--accent2:#0077ff;--text:#e8f0f8;--muted:#4a6070;--success:#00e5a0;--error:#ff4560;--warn:#ffb700;}
[data-theme="light"]{--bg:#f0f4fa;--surface:#ffffff;--surface2:#f5f7fa;--border:#dde2ed;--accent2:#0055cc;--text:#111827;--muted:#6b7280;--success:#059669;--error:#dc2626;--warn:#d97706;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Mono",monospace;background:var(--bg);color:var(--text);display:grid;grid-template-columns:220px 1fr;min-height:100vh;}

.topbar{grid-column:1/-1;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:30;}
.logo-img{width:32px;height:32px;border-radius:6px;object-fit:contain;background:var(--surface2);}
.logo-name{font-family:"Syne",sans-serif;font-size:13px;font-weight:700;}
.topbar-sep{flex:1;}
.theme-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;flex-direction:column;gap:5px;}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;}

.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;gap:2px;height:calc(100vh - 56px);position:sticky;top:56px;overflow-y:auto;}
.nav-section{font-size:9px;letter-spacing:2px;color:var(--muted);padding:12px 18px 6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:12px;color:var(--muted);text-decoration:none;transition:all 0.2s;}
.nav-item:hover{background:rgba(0,119,255,0.06);color:var(--text);}
.nav-item.active{background:rgba(0,119,255,0.1);color:var(--accent2);border-right:2px solid var(--accent2);}
.nav-icon{width:18px;text-align:center;font-size:14px;}

.main{padding:24px;overflow-y:auto;}

/* ESTADO TABS */
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.cat-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:none;font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
.cat-tab:hover{border-color:var(--accent2);color:var(--accent2);}
.cat-tab.active{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.cat-tab .cat-count{background:rgba(255,255,255,0.2);border-radius:10px;padding:1px 6px;font-size:9px;}

/* GRID */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.comp-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.2s;position:relative;}
.comp-card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,119,255,0.1);}
.comp-cat-badge{position:absolute;top:12px;right:12px;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:700;letter-spacing:1px;}
.comp-codigo{font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:1px;}
.comp-nombre{font-family:"Syne",sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3;}
.comp-marca{font-size:11px;color:var(--muted);margin-bottom:10px;}
.comp-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);gap:8px;}
.comp-stock{font-size:11px;padding:4px 8px;border-radius:6px;}
.estado-activo{background:rgba(0,229,160,0.1);color:var(--success);}
.estado-garantia{background:rgba(0,119,255,0.1);color:var(--accent2);}
.estado-en_reparacion{background:rgba(255,183,0,0.1);color:var(--warn);}
.estado-retirado{background:rgba(255,69,96,0.1);color:var(--error);}
.btn-mini{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 8px;font-size:10px;cursor:pointer;}
.btn-mini:hover{border-color:var(--accent2);color:var(--accent2);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;overflow-y:auto;padding:20px;}
.modal-overlay.open{display:block;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:620px;margin:20px auto;}
.mhead{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:1;}
.mhead h2{font-family:"Syne",sans-serif;font-size:15px;color:var(--accent2);letter-spacing:1px;}
.mbody{padding:22px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-grid.full{grid-template-columns:1fr;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
.fld input,.fld select,.fld textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:"DM Mono",monospace;font-size:12px;color:var(--text);outline:none;transition:border-color 0.2s;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent2);}
.fld textarea{min-height:70px;resize:vertical;}

/* CONTROLES */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.search-input{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-family:"DM Mono",monospace;font-size:12px;color:var(--text);outline:none;}
.search-input:focus{border-color:var(--accent2);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-family:"DM Mono",monospace;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;}
.btn-p{background:linear-gradient(135deg,var(--accent2),#0055cc);color:#fff;}
.btn-p:hover{opacity:0.9;}
.btn-o{background:none;border:1px solid var(--border);color:var(--muted);}
.btn-o:hover{border-color:var(--accent2);color:var(--accent2);}
.btn-danger{background:none;border:1px solid rgba(255,69,96,0.3);color:var(--error);}
.btn-danger:hover{background:rgba(255,69,96,0.08);}
.btn-sm{padding:6px 12px;font-size:10px;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-val{font-family:"Syne",sans-serif;font-size:22px;font-weight:800;color:var(--accent2);}
.stat-lbl{font-size:9px;letter-spacing:1.5px;color:var(--muted);margin-top:3px;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:19;}
@media(max-width:768px){
  body{grid-template-columns:1fr;}
  .hamburger{display:flex;}
  .sidebar{position:fixed;top:0;left:-240px;width:240px;height:100vh;z-index:20;transition:left 0.3s;}
  .sidebar.open{left:0;}
  .sidebar-overlay.open{display:block;}
  .stats-row{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .main{padding:14px;}
  .comp-grid{grid-template-columns:1fr;}
}
[data-theme="light"] .fld input,[data-theme="light"] .fld select,[data-theme="light"] .fld textarea{background:#fff;color:#111827;border-color:#dde2ed;}
[data-theme="light"] .comp-card{box-shadow:0 1px 4px rgba(0,0,0,0.06);}
</style>
</head>
<body>

<div class="topbar" style="grid-column:1/-1">
  <button class="hamburger" id="btnHamburger"><span></span><span></span><span></span></button>
  <img class="logo-img" src="../assets/logo512.png" onerror="this.style.display='none'">
  <span class="logo-name">Infraestructura-IT</span>
  <div class="topbar-sep"></div>
  <button class="theme-btn" id="themeBtn">🌙</button>
</div>

<div class="sidebar" id="sidebar">
  <div class="nav-section">PRINCIPAL</div>
  <a class="nav-item" href="dashboard.html"><span class="nav-icon">📋</span>Ordenes</a>
  <a class="nav-item" href="usuarios.html"><span class="nav-icon">👥</span>Usuarios</a>
  <a class="nav-item" href="protocolos.html"><span class="nav-icon">🔧</span>Protocolos</a>
  <a class="nav-item" href="cotizaciones.html"><span class="nav-icon">💰</span>Cotizaciones</a>
  <a class="nav-item" href="componentes.html"><span class="nav-icon">🔌</span>Componentes</a>
  <a class="nav-item active" href="inventario.html"><span class="nav-icon">🗄️</span>Inventario</a>
  <a class="nav-item" href="ia.html"><span class="nav-icon">⚡</span>Centro IA</a>
  <div class="nav-section">SISTEMA</div>
  <a class="nav-item" href="../perfil.html"><span class="nav-icon">👤</span>Perfil</a>
  <a class="nav-item" id="btnLogout" href="#"><span class="nav-icon">🚪</span>Salir</a>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
    <div>
      <div style="font-family:Syne,sans-serif;font-size:20px;font-weight:800;letter-spacing:1px;">INVENTARIO DE EQUIPOS</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px;">Equipos instalados por cliente — activos, garantías, historial</div>
    </div>
    <button class="btn btn-p" id="btnNuevo">+ Nuevo Equipo</button>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="stTotal">0</div><div class="stat-lbl">TOTAL</div></div>
    <div class="stat-card"><div class="stat-val" id="stActivos" style="color:var(--success);">0</div><div class="stat-lbl">ACTIVOS</div></div>
    <div class="stat-card"><div class="stat-val" id="stGarantia" style="color:var(--accent2);">0</div><div class="stat-lbl">EN GARANTIA</div></div>
    <div class="stat-card"><div class="stat-val" id="stReparacion" style="color:var(--warn);">0</div><div class="stat-lbl">EN REPARACION</div></div>
  </div>

  <!-- FILTROS -->
  <div class="controls">
    <select class="search-input" style="flex:0 0 auto;width:auto;min-width:220px;" id="filterCliente">
      <option value="">— Todos los clientes —</option>
    </select>
    <input class="search-input" id="searchInput" placeholder="Buscar por tipo, marca, modelo, serie...">
  </div>

  <!-- ESTADO TABS -->
  <div class="cat-tabs" id="catTabs"></div>

  <!-- GRID -->
  <div class="comp-grid" id="compGrid">
    <div class="empty"><p>Cargando...</p></div>
  </div>
</div>

<!-- MODAL EDITOR -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="mhead">
      <h2 id="modalTitulo">NUEVO EQUIPO</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-danger btn-sm" id="btnEliminar" style="display:none;">✕ Eliminar</button>
        <button class="btn btn-o btn-sm" id="btnCerrar">CERRAR</button>
      </div>
    </div>
    <div class="mbody">
      <input type="hidden" id="f_id">
      <div class="form-grid full">
        <div class="fld"><label>Cliente *</label>
          <select id="f_cliente"><option value="">— Seleccionar cliente —</option></select>
        </div>
      </div>
      <div class="form-grid full">
        <div class="fld"><label>Componente del catálogo (opcional)</label>
          <select id="f_componente"><option value="">— Ninguno / equipo de terceros —</option></select>
        </div>
      </div>
      <div class="form-grid">
        <div class="fld"><label>Tipo de equipo *</label><input id="f_tipo" placeholder="Ej: Cámara IP, UPS, Switch..."></div>
        <div class="fld"><label>Estado</label>
          <select id="f_estado">
            <option value="activo">Activo</option>
            <option value="garantia">En garantía</option>
            <option value="en_reparacion">En reparación</option>
            <option value="retirado">Retirado</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="fld"><label>Marca</label><input id="f_marca" placeholder="Marca"></div>
        <div class="fld"><label>Modelo</label><input id="f_modelo" placeholder="Modelo"></div>
      </div>
      <div class="form-grid">
        <div class="fld"><label>Número de serie</label><input id="f_serie" placeholder="S/N"></div>
        <div class="fld"><label>Ubicación física</label><input id="f_ubicacion" placeholder="Ej: Recepción, Bodega 2..."></div>
      </div>
      <div class="form-grid">
        <div class="fld"><label>Fecha de instalación</label><input id="f_fecha" type="date"></div>
        <div class="fld"><label>Comprobante / Factura (URL)</label><input id="f_factura" placeholder="https://..."></div>
      </div>
      <div class="form-grid full">
        <div class="fld"><label>Notas</label><textarea id="f_notas" placeholder="Observaciones, historial relevante..."></textarea></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:10px;border-top:1px solid var(--border);">
        <button class="btn btn-o" id="btnCancelar">Cancelar</button>
        <button class="btn btn-p" id="btnGuardar">GUARDAR</button>
      </div>
    </div>
  </div>
</div>

<script src="../assets/supabase.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/theme.js"></script>
<script>
let _user=null, _equipos=[], _clientes=[], _componentes=[], _estadoActivo='all', _editId=null;

const ESTADOS = {
  all:           {label:'Todos',          icon:'🗄️'},
  activo:        {label:'Activos',        icon:'✅'},
  garantia:      {label:'En garantía',    icon:'🛡️'},
  en_reparacion: {label:'En reparación',  icon:'🔧'},
  retirado:      {label:'Retirados',      icon:'🚫'},
};

(async()=>{
  _user = await initAuth('admin');
  if(!_user) return;
  await Promise.all([loadClientes(), loadComponentes()]);
  await cargar();
  renderEstadoTabs();
  setupEvents();
})();

async function loadClientes(){
  const {data:cls} = await db.from('clientes').select('id,empresa,usuario_id');
  const {data:usrs} = await db.from('usuarios').select('id,nombre');
  const usrMap={}; (usrs||[]).forEach(u=>usrMap[u.id]=u);
  _clientes = (cls||[]).map(c=>({...c, nombre:usrMap[c.usuario_id]?.nombre||''}));
  const opts = '<option value="">— Seleccionar cliente —</option>' +
    _clientes.map(c=>'<option value="'+c.id+'">'+(c.empresa||c.nombre||'Sin nombre')+'</option>').join('');
  document.getElementById('f_cliente').innerHTML = opts;
  document.getElementById('filterCliente').innerHTML =
    '<option value="">— Todos los clientes —</option>' +
    _clientes.map(c=>'<option value="'+c.id+'">'+(c.empresa||c.nombre||'Sin nombre')+'</option>').join('');
}

async function loadComponentes(){
  const {data} = await db.from('componentes').select('id,codigo,nombre,marca,modelo,categoria').eq('activo',true).order('nombre');
  _componentes = data||[];
  document.getElementById('f_componente').innerHTML =
    '<option value="">— Ninguno / equipo de terceros —</option>' +
    _componentes.map(c=>'<option value="'+c.id+'">'+c.nombre+(c.marca?' — '+c.marca:'')+(c.modelo?' '+c.modelo:'')+'</option>').join('');
}

async function cargar(){
  const {data,error} = await db.from('equipos_cliente')
    .select('*, clientes(empresa), componentes(nombre,marca,modelo,categoria)')
    .order('created_at',{ascending:false});
  if(error){ console.error(error); toast('Error cargando inventario: '+error.message,'error'); return; }
  _equipos = data||[];
  updateStats();
  renderGrid();
}

function updateStats(){
  document.getElementById('stTotal').textContent       = _equipos.length;
  document.getElementById('stActivos').textContent     = _equipos.filter(e=>e.estado==='activo').length;
  document.getElementById('stGarantia').textContent    = _equipos.filter(e=>e.estado==='garantia').length;
  document.getElementById('stReparacion').textContent  = _equipos.filter(e=>e.estado==='en_reparacion').length;
}

function renderEstadoTabs(){
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = Object.entries(ESTADOS).map(([k,v])=>{
    const count = k==='all' ? _equipos.length : _equipos.filter(e=>e.estado===k).length;
    return '<button class="cat-tab'+(k===_estadoActivo?' active':'')+'" data-estado="'+k+'">'+
      v.icon+' '+v.label+'<span class="cat-count">'+count+'</span></button>';
  }).join('');
  tabs.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{ _estadoActivo=btn.dataset.estado; renderEstadoTabs(); renderGrid(); });
  });
}

function renderGrid(){
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const clF = document.getElementById('filterCliente').value;
  let f = _equipos;
  if(_estadoActivo!=='all') f=f.filter(e=>e.estado===_estadoActivo);
  if(clF) f=f.filter(e=>e.cliente_id===clF);
  if(q) f=f.filter(e=>(e.tipo_equipo+' '+(e.marca||'')+' '+(e.modelo||'')+' '+(e.numero_serie||'')).toLowerCase().includes(q));

  const grid = document.getElementById('compGrid');
  if(!f.length){ grid.innerHTML='<div class="empty"><p>No hay equipos en esta vista</p></div>'; return; }

  grid.innerHTML = f.map(e=>{
    const est = ESTADOS[e.estado]||ESTADOS.activo;
    const empresa = e.clientes?.empresa || 'Sin cliente';
    const marcaModelo = [e.marca,e.modelo].filter(Boolean).join(' ');
    return '<div class="comp-card" data-id="'+e.id+'">'+
      '<div class="comp-cat-badge estado-'+e.estado+'">'+est.icon+' '+est.label+'</div>'+
      '<div class="comp-codigo">'+empresa+'</div>'+
      '<div class="comp-nombre">'+e.tipo_equipo+'</div>'+
      '<div class="comp-marca">'+(marcaModelo||'—')+(e.numero_serie?' · S/N '+e.numero_serie:'')+'</div>'+
      '<div class="comp-footer">'+
        '<div style="font-size:10px;color:var(--muted);">'+(e.ubicacion||'Sin ubicación')+'</div>'+
        '<button class="btn-mini" data-crear-orden="'+e.id+'">+ Orden</button>'+
      '</div>'+
    '</div>';
  }).join('');

  document.querySelectorAll('.comp-card').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.closest('[data-crear-orden]')) return;
      abrirEditor(card.dataset.id);
    });
  });
  document.querySelectorAll('[data-crear-orden]').forEach(btn=>{
    btn.addEventListener('click',e=>{ e.stopPropagation(); crearOrdenDesdeEquipo(btn.dataset.crearOrden); });
  });
}

function abrirEditor(id=null){
  _editId=id;
  const e=id?_equipos.find(x=>x.id===id):null;
  document.getElementById('modalTitulo').textContent = e?'EDITAR EQUIPO':'NUEVO EQUIPO';
  document.getElementById('btnEliminar').style.display = e?'inline-flex':'none';
  document.getElementById('f_id').value        = e?.id||'';
  document.getElementById('f_cliente').value    = e?.cliente_id||'';
  document.getElementById('f_componente').value= e?.componente_id||'';
  document.getElementById('f_tipo').value      = e?.tipo_equipo||'';
  document.getElementById('f_estado').value    = e?.estado||'activo';
  document.getElementById('f_marca').value     = e?.marca||'';
  document.getElementById('f_modelo').value    = e?.modelo||'';
  document.getElementById('f_serie').value     = e?.numero_serie||'';
  document.getElementById('f_ubicacion').value = e?.ubicacion||'';
  document.getElementById('f_fecha').value     = e?.fecha_instalacion||'';
  document.getElementById('f_factura').value   = e?.factura_url||'';
  document.getElementById('f_notas').value     = e?.notas||'';
  document.getElementById('modalOverlay').classList.add('open');
}

// Autocompletar marca/modelo al elegir componente del catalogo
document.addEventListener('change',e=>{
  if(e.target?.id!=='f_componente') return;
  const comp=_componentes.find(c=>c.id===e.target.value);
  if(comp){
    if(!document.getElementById('f_marca').value)  document.getElementById('f_marca').value  = comp.marca||'';
    if(!document.getElementById('f_modelo').value) document.getElementById('f_modelo').value = comp.modelo||'';
    if(!document.getElementById('f_tipo').value)   document.getElementById('f_tipo').value    = comp.nombre||'';
  }
});

async function guardar(){
  const cliente_id = document.getElementById('f_cliente').value;
  const tipo_equipo = document.getElementById('f_tipo').value.trim();
  if(!cliente_id){ toast('Selecciona un cliente','error'); return; }
  if(!tipo_equipo){ toast('El tipo de equipo es requerido','error'); return; }
  const payload={
    cliente_id,
    componente_id:   document.getElementById('f_componente').value||null,
    tipo_equipo,
    marca:            document.getElementById('f_marca').value.trim()||null,
    modelo:           document.getElementById('f_modelo').value.trim()||null,
    numero_serie:     document.getElementById('f_serie').value.trim()||null,
    ubicacion:        document.getElementById('f_ubicacion').value.trim()||null,
    fecha_instalacion:document.getElementById('f_fecha').value||null,
    factura_url:      document.getElementById('f_factura').value.trim()||null,
    estado:           document.getElementById('f_estado').value,
    notas:            document.getElementById('f_notas').value.trim()||null,
    updated_at:       new Date().toISOString(),
  };
  let error;
  if(_editId){
    ({error}=await db.from('equipos_cliente').update(payload).eq('id',_editId));
  } else {
    ({error}=await db.from('equipos_cliente').insert(payload));
  }
  if(error){ toast('Error: '+error.message,'error'); return; }
  toast((_editId?'Actualizado':'Creado')+': '+tipo_equipo,'success');
  document.getElementById('modalOverlay').classList.remove('open');
  await cargar();
  renderEstadoTabs();
}

async function eliminar(){
  if(!_editId||!confirm('¿Eliminar este equipo del inventario?')) return;
  const {error}=await db.from('equipos_cliente').delete().eq('id',_editId);
  if(error){ toast('Error: '+error.message,'error'); return; }
  toast('Equipo eliminado','success');
  document.getElementById('modalOverlay').classList.remove('open');
  await cargar();
  renderEstadoTabs();
}

// Prepara los datos del equipo para crear una orden en dashboard.html.
// La precarga automatica via URL queda pendiente (issue #9);
// por ahora se copian los datos clave al portapapeles para pegarlos en "Nueva Orden".
async function crearOrdenDesdeEquipo(id){
  const e=_equipos.find(x=>x.id===id);
  if(!e) return;
  const empresa = e.clientes?.empresa||'';
  const compNombre = e.componentes?.nombre||'';
  const resumen =
    'Empresa: '+empresa+'\n'+
    'Equipo: '+e.tipo_equipo+(e.marca?' '+e.marca:'')+(e.modelo?' '+e.modelo:'')+'\n'+
    (e.numero_serie?'N/S: '+e.numero_serie+'\n':'')+
    (e.ubicacion?'Ubicacion: '+e.ubicacion+'\n':'')+
    (compNombre?'Componente catalogo: '+compNombre+'\n':'');
  try{
    await navigator.clipboard.writeText(resumen);
    toast('Datos del equipo copiados — pega en "Nueva Orden" en Ordenes','success');
  }catch(_e){
    toast('Equipo: '+e.tipo_equipo+' — '+empresa,'info');
  }
  setTimeout(()=>{ window.location.href='dashboard.html'; }, 900);
}

function setupEvents(){
  document.getElementById('btnNuevo').addEventListener('click',()=>abrirEditor());
  document.getElementById('btnGuardar').addEventListener('click',guardar);
  document.getElementById('btnEliminar').addEventListener('click',eliminar);
  document.getElementById('btnCerrar').addEventListener('click',()=>document.getElementById('modalOverlay').classList.remove('open'));
  document.getElementById('btnCancelar').addEventListener('click',()=>document.getElementById('modalOverlay').classList.remove('open'));
  document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)document.getElementById('modalOverlay').classList.remove('open');});
  document.getElementById('searchInput').addEventListener('input',renderGrid);
  document.getElementById('filterCliente').addEventListener('change',renderGrid);
  document.getElementById('btnLogout')?.addEventListener('click',async()=>{await supabase.auth.signOut();window.location.href='../login.html';});
  const btn=document.getElementById('btnHamburger');
  const sidebar=document.querySelector('.sidebar');
  const overlay=document.getElementById('sidebarOverlay');
  btn?.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
  overlay?.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
}

function toast(msg,tipo='success'){
  const t=document.createElement('div');
  const c={success:'var(--success)',error:'var(--error)',info:'var(--accent2)',warn:'var(--warn)'};
  t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--surface);border:1px solid '+c[tipo]+';border-radius:10px;padding:12px 18px;box-shadow:0 8px 32px rgba(0,0,0,0.4);font-family:"DM Mono",monospace;font-size:12px;color:'+c[tipo]+';';
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
</script>
