<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIT — Mi Orden</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b10;--surface:#0d1117;--surface2:#131820;--border:#1e2a38;--accent:#00d4ff;--accent2:#0077ff;--text:#e8f0f8;--muted:#4a6070;--success:#00e5a0;--error:#ff4560;--warn:#ffb700;}

/* ══════════════════════════════════════════
   TEMA CLARO — BLANCO PROFESIONAL
   ══════════════════════════════════════════ */
[data-theme="light"] {
  --bg:      #ffffff;
  --surface: #f5f7fa;
  --surface2:#eef1f6;
  --border:  #dde2ed;
  --accent:  #0077ff;
  --accent2: #0055cc;
  --text:    #111827;
  --muted:   #6b7280;
  --success: #059669;
  --error:   #dc2626;
  --warn:    #d97706;
  --purple:  #7c3aed;
}
[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(0,85,204,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,85,204,0.04) 1px, transparent 1px);
}
[data-theme="light"] .topbar {
  background: rgba(255,255,255,0.97);
  box-shadow: 0 1px 12px rgba(0,0,0,0.08);
}
[data-theme="light"] .sidebar {
  background: #f5f7fa;
  box-shadow: 1px 0 12px rgba(0,0,0,0.05);
}
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] textarea {
  background: #ffffff;
  color: var(--text);
}
[data-theme="light"] input::placeholder,
[data-theme="light"] textarea::placeholder { color: #9ca3af; }
[data-theme="light"] select option { background: #ffffff; color: #111827; }
[data-theme="light"] .modal,
[data-theme="light"] .modal-overlay > .modal { background: #ffffff; }
[data-theme="light"] .tw,
[data-theme="light"] .stat-card,
[data-theme="light"] .cot-card,
[data-theme="light"] .proto-preview,
[data-theme="light"] .res-card,
[data-theme="light"] .card { background: #ffffff; }
[data-theme="light"] tbody tr:hover { background: #f0f4ff; }
[data-theme="light"] .nav-item.active { background: rgba(0,85,204,0.08); }
[data-theme="light"] .nav-item:hover  { background: rgba(0,0,0,0.04); }
[data-theme="light"] .badge.b-borrador { background: rgba(107,114,128,0.1); }
[data-theme="light"] #themeToggle {
  background: rgba(0,85,204,0.08);
  border-color: rgba(0,85,204,0.2);
}

/* TOGGLE BUTTON BASE */
#themeToggle {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
#themeToggle:hover { opacity: 0.8; transform: scale(1.05); }

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Mono",monospace;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.topbar{background:rgba(8,11,16,0.97);border-bottom:1px solid var(--border);padding:0 20px;height:60px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);}
.logo-img{width:30px;height:30px;object-fit:contain;}
.logo-name{font-family:"Syne",sans-serif;font-size:13px;font-weight:700;color:var(--text);}
.topbar-sep{flex:1;}
.wrapper{max-width:760px;margin:0 auto;padding:24px 16px 60px;position:relative;z-index:1;}
.btn{padding:8px 16px;border-radius:7px;font-family:"Syne",sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.5px;transition:all 0.2s;border:none;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-o{background:none;border:1px solid var(--border);color:var(--muted);}
.btn-o:hover{border-color:var(--accent2);color:var(--accent);}

/* HEADER ORDEN */
.orden-header{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden;}
.orden-header::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.oh-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.oh-id{font-family:"Syne",sans-serif;font-size:22px;font-weight:800;color:var(--accent);letter-spacing:2px;}
.oh-empresa{font-size:13px;color:var(--text);margin-top:4px;}
.oh-fecha{font-size:11px;color:var(--muted);margin-top:2px;}
.badge{display:inline-flex;align-items:center;padding:6px 14px;border-radius:6px;font-size:10px;letter-spacing:1px;font-weight:700;border:1px solid;}
.b-borrador,.b-pendiente{background:rgba(255,183,0,0.1);border-color:rgba(255,183,0,0.3);color:var(--warn);}
.b-asignada{background:rgba(0,119,255,0.1);border-color:rgba(0,119,255,0.3);color:var(--accent2);}
.b-en_proceso{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.3);color:var(--accent);}
.b-en_pausa{background:rgba(255,140,0,0.1);border-color:rgba(255,140,0,0.3);color:#ff8c00;}
.b-cerrada{background:rgba(0,229,160,0.1);border-color:rgba(0,229,160,0.3);color:var(--success);}
.b-cancelada{background:rgba(255,69,96,0.1);border-color:rgba(255,69,96,0.3);color:var(--error);}

/* TIMELINE */
.timeline{display:flex;align-items:flex-start;padding:4px 0;margin-top:4px;}
.tl-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--surface2);z-index:1;transition:all 0.3s;}
.tl-dot.done{border-color:var(--success);background:var(--success);}
.tl-dot.active{border-color:var(--accent2);background:var(--accent2);box-shadow:0 0 10px rgba(0,119,255,0.5);}
.tl-label{font-size:9px;color:var(--muted);margin-top:6px;letter-spacing:0.5px;text-align:center;}
.tl-label.active{color:var(--accent2);font-weight:700;}
.tl-label.done{color:var(--success);}
.tl-line{position:absolute;top:7px;left:50%;width:100%;height:2px;background:var(--border);z-index:0;}
.tl-line.done{background:var(--success);}

/* NAVEGACION POR PASOS */
.sec{display:block;}

@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* SECCION */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.sec-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.2);}
.sec-num{width:22px;height:22px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#080b10;flex-shrink:0;}
.sec-title{font-family:"Syne",sans-serif;font-size:12px;font-weight:700;color:var(--text);}
.sec-body{padding:18px 20px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:500px){.dgrid{grid-template-columns:1fr;}}
.df .dl{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
.df .dv{font-size:13px;color:var(--text);}
.sintoma-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;color:var(--text);line-height:1.6;}
.eq-tag{display:inline-block;padding:4px 10px;background:rgba(0,119,255,0.08);border:1px solid rgba(0,119,255,0.2);border-radius:4px;font-size:11px;color:var(--accent2);margin:2px;}

/* HISTORIAL */
.hist-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.hist-item:last-child{border-bottom:none;}
.hist-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;}
.hist-icon-status{background:rgba(0,119,255,0.1);border:1px solid rgba(0,119,255,0.2);}
.hist-icon-nota{background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.2);}
.hist-body{flex:1;}
.hist-titulo{font-size:12px;color:var(--text);margin-bottom:2px;}
.hist-fecha{font-size:10px;color:var(--muted);}

/* PROTOCOLO RESULTADO */
.proto-resultado{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;}
.proto-campo{padding:10px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 2fr;gap:12px;align-items:start;}
.proto-campo:last-child{border-bottom:none;}
.pc-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.pc-val{font-size:13px;color:var(--text);}
.pc-val.val-si{color:var(--success);}
.pc-val.val-no{color:var(--error);}
.pc-foto{max-width:200px;border-radius:8px;margin-top:4px;}
.tipo-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;margin-right:4px;}
.tipo-si_no{background:rgba(0,229,160,0.08);color:var(--success);}
.tipo-numero{background:rgba(0,119,255,0.08);color:var(--accent2);}
.tipo-texto{background:rgba(74,96,112,0.15);color:#8a9bb0;}
.tipo-lista{background:rgba(255,183,0,0.08);color:var(--warn);}
.tipo-rango{background:rgba(0,212,255,0.08);color:var(--accent);}
.proto-completado{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(0,229,160,0.05);border:1px solid rgba(0,229,160,0.2);border-radius:8px;margin-bottom:12px;font-size:12px;color:var(--success);}

/* FIRMA VIEWER */
.firma-img{max-width:300px;border-radius:8px;border:1px solid var(--border);background:white;padding:8px;}

/* TEMA CLARO — FORMULARIOS LEGIBLES */
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] textarea { color: #111827 !important; background: #ffffff; border-color: #d1d5db; }
[data-theme="light"] input:disabled,
[data-theme="light"] select:disabled { background: #f9fafb !important; color: #374151 !important; }
[data-theme="light"] label { color: #374151; }
[data-theme="light"] .muted,
[data-theme="light"] [style*="color:var(--muted)"] { color: #6b7280; }
[data-theme="light"] tbody td { color: #111827; }
[data-theme="light"] .modal,
[data-theme="light"] .modal-overlay > div { background: #ffffff !important; }
[data-theme="light"] .msec-t { color: #111827; }
[data-theme="light"] .item-row input { background: #ffffff; color: #111827; border-color: #d1d5db; }
[data-theme="light"] .items-wrap { background: #f9fafb; border-color: #d1d5db; }
[data-theme="light"] .items-head { color: #6b7280; background: #f3f4f6; }
[data-theme="light"] .item-total { color: #059669; }
[data-theme="light"] .tot-label { color: #6b7280; }
[data-theme="light"] .tot-val { color: #111827; }
[data-theme="light"] .sec-head .sec-title { color: #111827; }
[data-theme="light"] .field label { color: #374151; }

/* ══════════════════════════════════════════
   RESPONSIVE MOVIL
   ══════════════════════════════════════════ */
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;flex-direction:column;gap:5px;}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:all 0.3s;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:19;backdrop-filter:blur(2px);}

@media(max-width:768px){
  body{grid-template-columns:1fr !important;}
  .hamburger{display:flex;}
  .sidebar{position:fixed !important;top:0;left:-280px;width:280px;height:100vh !important;z-index:20;transition:left 0.3s ease;box-shadow:4px 0 24px rgba(0,0,0,0.4);}
  .sidebar.open{left:0;}
  .sidebar-overlay.open{display:block;}
  .main{padding:14px !important;}
  .stats-row,.stats-grid{grid-template-columns:1fr 1fr !important;gap:10px !important;}
  .row2,.row3,.row4{grid-template-columns:1fr !important;}
  .filters{flex-direction:column !important;}
  .modal{margin:10px auto !important;}
  .modal-overlay{padding:8px !important;}
  .dgrid{grid-template-columns:1fr !important;}
  .df.full{grid-column:1 !important;}
  .sbtns{flex-wrap:wrap !important;}
  .sbtn{font-size:9px !important;padding:6px 8px !important;}
  .items-head,.item-row{grid-template-columns:28px 1fr 60px 90px 36px !important;}
  .items-head div:nth-child(2),.item-row .i-ref,
  .items-head div:nth-child(6),.item-row .i-dpct,
  .items-head div:nth-child(7),.item-row .i-iva{display:none !important;}
}
@media(max-width:480px){
  .topbar{padding:0 12px !important;gap:8px !important;}
  .logo-name{display:none;}
  .stats-row,.stats-grid{grid-template-columns:1fr 1fr !important;}
  .tab{font-size:10px !important;padding:8px 6px !important;}
  .tab span:last-child{display:none;}
}

</style>
<script src="../assets/theme.js"></script>
</head>

<script>
let _user = null, _orden = null;
const params  = new URLSearchParams(window.location.search);
const ordenId = params.get('id');

const CLO_STATUS_STEPS = ['pendiente','asignada','en_proceso','cerrada'];
const CLO_STATUS_LABEL = {
  borrador:'Borrador', pendiente:'Pendiente', asignada:'Asignada',
  en_proceso:'En Proceso', en_pausa:'En Pausa', cerrada:'Cerrada', cancelada:'Cancelada'
};

(async () => {
  _user = await initAuth('cliente');
  if (!_user) return;
  if (!ordenId) { window.location.href = 'dashboard.html'; return; }
  await loadOrden();
  await loadHistorial();
  await loadProtocolo();

  // PDF individual
  document.getElementById('btnPdfOrden').addEventListener('click', async () => {
    if (!_orden) return;
    toast('Generando PDF...','info');
    const hist = await db.from('historial_ordenes')
      .select('*,usuarios(nombre)')
      .eq('orden_id', ordenId)
      .order('created_at',{ascending:true})
      .then(r => r.data || []);
    const logo = await cargarLogoPDF();
    await exportarPDFOrden(_orden, hist, null, logo);
  });
})();

async function loadOrden() {
  const { data, error } = await db.from('ordenes').select('*').eq('id', ordenId).single();
  if (error || !data) { window.location.href = 'dashboard.html'; return; }
  _orden = data;

  // Header
  document.getElementById('ohId').textContent      = data.orden_id || '—';
  document.getElementById('ohEmpresa').textContent  = data.empresa || '—';
  document.getElementById('ohFecha').textContent    = 'Creada: ' + (data.created_at ? new Date(data.created_at).toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'}) : '—');
  const badge = document.getElementById('ohBadge');
  badge.innerHTML = '<span class="badge b-' + (data.status||'pendiente') + '">' + (CLO_STATUS_LABEL[data.status]||'—').toUpperCase() + '</span>';

  // Timeline
  const steps = CLO_STATUS_STEPS;
  const curIdx = steps.indexOf(data.status);
  document.getElementById('timeline').innerHTML = steps.map((s,i) => {
    const isDone   = curIdx > i;
    const isActive = curIdx === i;
    const isLast   = i === steps.length - 1;
    return '<div class="tl-step">' +
      (!isLast ? '<div class="tl-line' + (isDone ? ' done' : '') + '"></div>' : '') +
      '<div class="tl-dot' + (isDone ? ' done' : isActive ? ' active' : '') + '"></div>' +
      '<div class="tl-label' + (isDone ? ' done' : isActive ? ' active' : '') + '">' + CLO_STATUS_LABEL[s] + '</div>' +
      '</div>';
  }).join('');

  // Datos
  document.getElementById('d_tipo').textContent = data.tipo_servicio || '—';
  document.getElementById('d_area').textContent = data.area || '—';
  document.getElementById('d_fecha').textContent = data.fecha_requerida || '—';
  document.getElementById('d_ciudad').textContent = data.ciudad || '—';
  document.getElementById('d_dir').textContent = data.direccion || '—';
  document.getElementById('d_sintoma').textContent = data.sintoma || '—';

  const priColor = { baja:'var(--success)', media:'var(--warn)', alta:'var(--error)', critica:'var(--error)' }[data.prioridad] || 'var(--muted)';
  document.getElementById('d_prioridad').innerHTML = '<span style="color:' + priColor + ';font-weight:700;">' + (data.prioridad||'—').toUpperCase() + '</span>';

  const eqEl = document.getElementById('d_equipos');
  (data.equipos || []).forEach(e => {
    const span = document.createElement('span');
    span.className = 'eq-tag'; span.textContent = e;
    eqEl.appendChild(span);
  });
  if (!(data.equipos||[]).length) eqEl.innerHTML = '<span style="color:var(--muted);font-size:12px;">No especificados</span>';
}

async function loadHistorial() {
  const { data } = await db.from('historial_ordenes')
    .select('*,usuarios(nombre,rol)')
    .eq('orden_id', ordenId)
    .order('created_at', { ascending: true });

  const el = document.getElementById('historialBody');
  if (!data || !data.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;">Sin actualizaciones registradas aun.</div>';
    return;
  }

  el.innerHTML = data.map(h => {
    const isStatus = h.campo_modificado === 'status';
    return '<div class="hist-item">' +
      '<div class="hist-icon ' + (isStatus ? 'hist-icon-status' : 'hist-icon-nota') + '">' +
        (isStatus ? '&#128203;' : '&#128196;') +
      '</div>' +
      '<div class="hist-body">' +
        '<div class="hist-titulo">' +
          (isStatus
            ? 'Estado actualizado: <strong style="color:var(--text);">' + (CLO_STATUS_LABEL[h.valor_nuevo]||h.valor_nuevo) + '</strong>'
            : h.campo_modificado + ': ' + (h.valor_anterior||'—') + ' &rarr; ' + (h.valor_nuevo||'—')
          ) +
        '</div>' +
        '<div class="hist-fecha">' + formatFecha(h.created_at) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function loadProtocolo() {
  const { data: ejec } = await db.from('protocolo_ejecucion')
    .select('*,protocolos(nombre,equipo_tipo),protocolo_respuestas(*,protocolo_campos(etiqueta,tipo,unidad))')
    .eq('orden_id', ordenId)
    .eq('status', 'completado')
    .single();

  if (!ejec) return;

  const sec  = document.getElementById('secProtocolo');
  const body = document.getElementById('protoBody');
  sec.style.display = 'block';

  const respuestas = (ejec.protocolo_respuestas || []).sort((a,b) => {
    const oa = a.protocolo_campos?.orden || 0;
    const ob = b.protocolo_campos?.orden || 0;
    return oa - ob;
  });

  const tipoLabel = {texto:'Texto',numero:'Numero',si_no:'Si/No',lista:'Lista',rango:'Rango',fecha_hora:'Fecha',foto:'Foto',firma:'Firma'};

  body.innerHTML =
    '<div class="proto-completado">&#10003; Protocolo completado: <strong>' + (ejec.protocolos?.nombre||'—') + '</strong>' +
    ' · <span style="color:var(--muted);">' + (ejec.fecha_fin ? formatFechaCorta(ejec.fecha_fin) : '') + '</span></div>' +
    '<div class="proto-resultado">' +
    respuestas.map(r => {
      const c = r.protocolo_campos;
      if (!c) return '';
      let val = '';
      if (c.tipo === 'si_no')     val = '<span class="pc-val ' + (r.valor_boolean ? 'val-si' : 'val-no') + '">' + (r.valor_boolean ? '✓ SI' : '✗ NO') + '</span>';
      else if (c.tipo === 'numero' || c.tipo === 'rango') val = '<span class="pc-val">' + (r.valor_numero ?? '—') + (c.unidad ? ' <span style="color:var(--muted);">' + c.unidad + '</span>' : '') + '</span>';
      else if (c.tipo === 'lista') val = '<span class="pc-val">' + (r.valor_opcion||'—') + '</span>';
      else if (c.tipo === 'fecha_hora') val = '<span class="pc-val">' + (r.valor_fecha ? formatFechaCorta(r.valor_fecha) : '—') + '</span>';
      else if (c.tipo === 'foto' && r.archivo_url) val = '<img class="pc-foto" src="' + r.archivo_url + '" alt="Foto">';
      else if (c.tipo === 'firma' && r.archivo_url) val = '<img class="firma-img" src="' + r.archivo_url + '" alt="Firma">';
      else val = '<span class="pc-val">' + (r.valor_texto||'—') + '</span>';
      return '<div class="proto-campo"><div class="pc-label">' + c.etiqueta + '</div><div>' + val + '</div></div>';
    }).join('') +
    '</div>' +
    (ejec.firma_tecnico ? '<div style="margin-top:14px;"><div class="dl" style="margin-bottom:8px;font-size:9px;color:var(--muted);letter-spacing:1.5px;">FIRMA DEL TECNICO</div><img class="firma-img" src="' + ejec.firma_tecnico + '" alt="Firma tecnico"></div>' : '');
}

function toast(msg, tipo='success') {
  const c={success:'var(--success)',error:'var(--error)',info:'var(--accent2)'};
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--surface);border:1px solid '+c[tipo]+';border-radius:10px;padding:12px 18px;box-shadow:0 8px 32px rgba(0,0,0,0.4);font-family:"DM Mono",monospace;font-size:12px;color:'+c[tipo]+';letter-spacing:0.5px;';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}



// ── CARGAR LOGO PARA PDF ──────────────────────────────────────
async function cargarLogoPDF() {
  return new Promise((res) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.width; cv.height = img.height;
      cv.getContext('2d').drawImage(img, 0, 0);
      res(cv.toDataURL('image/png'));
    };
    img.onerror = () => res(null);
    img.src = 'https://infraestructura-it.github.io/iit-ordenes-servicio-v2/assets/logo512.png';
  });
}


// ── MENU HAMBURGUESA ──────────────────────────────────────────
(function(){
  const btn=document.getElementById('btnHamburger');
  const sidebar=document.querySelector('.sidebar');
  const overlay=document.getElementById('sidebarOverlay');
  if(!btn||!sidebar) return;
  const open=()=>{sidebar.classList.add('open');if(overlay)overlay.classList.add('open');};
  const close=()=>{sidebar.classList.remove('open');if(overlay)overlay.classList.remove('open');};
  btn.addEventListener('click',()=>sidebar.classList.contains('open')?close():open());
  if(overlay) overlay.addEventListener('click',close);
  document.querySelectorAll('.nav-item').forEach(a=>a.addEventListener('click',close));
})();

</script>
